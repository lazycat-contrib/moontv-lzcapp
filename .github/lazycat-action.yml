version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/moontv.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: moontv
build:
  run_buildscript: false
images:
  # 主应用：上游 ghcr 只有 latest + v100.1.x immutable 家族，latest 为 mutable → 用 v100.1.x 家族
  - id: moontv
    target: service
    service: moontv
    source: ghcr.io/moontechlab/lunatv
    channel: stable
    sort: semver
    tag_regex: '^v100\.\d+\.\d+$'
    delivery:
      mode: mirror
  # 辅助 redis：7.x-alpine 浮动家族，tag 带后缀 → custom + 版本映射
  - id: moontv-redis
    target: service
    service: moontv-redis
    source: library/redis
    channel: custom
    sort: semver
    tag_regex: '^7\.\d+-alpine$'
    version_regex: '^(?P<version>7\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: MoonTV
    summary: "开箱即用的、跨平台的影视聚合播放器"
